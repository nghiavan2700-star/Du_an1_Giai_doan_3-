<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Trợ lý AI sinh viên</title>

    <style>
        :root {
            --background: #eef2f7;
            --container: #ffffff;
            --chat-background: #f5f7fb;
            --text: #1f2937;
            --border: #d9dee8;
            --primary: #2563eb;
            --ai-message: #ffffff;
        }

        body.dark {
            --background: #151922;
            --container: #202531;
            --chat-background: #181d27;
            --text: #f3f4f6;
            --border: #3b4352;
            --primary: #4f7df3;
            --ai-message: #2a303d;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: var(--background);
            color: var(--text);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.25s;
        }

        .app {
            width: 92%;
            max-width: 760px;
            height: 88vh;
            background: var(--container);
            border: 1px solid var(--border);
            border-radius: 14px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.12);
        }

        .header {
            background: var(--primary);
            color: white;
            padding: 16px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .header h1 {
            margin: 0;
            font-size: 21px;
        }

        .header p {
            margin: 4px 0 0;
            font-size: 13px;
            opacity: 0.9;
        }

        .header-actions {
            display: flex;
            gap: 8px;
        }

        .small-button {
            border: 1px solid rgba(255, 255, 255, 0.7);
            background: transparent;
            color: white;
            padding: 8px 10px;
            border-radius: 7px;
            cursor: pointer;
        }

        .small-button:hover {
            background: rgba(255, 255, 255, 0.16);
        }

        #chatBox {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            background: var(--chat-background);
        }

        .message-row {
            display: flex;
            margin-bottom: 14px;
        }

        .message-row.user {
            justify-content: flex-end;
        }

        .bubble {
            max-width: 78%;
            padding: 11px 14px;
            border-radius: 13px;
            line-height: 1.5;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .message-row.user .bubble {
            background: var(--primary);
            color: white;
            border-bottom-right-radius: 4px;
        }

        .message-row.ai .bubble {
            background: var(--ai-message);
            color: var(--text);
            border: 1px solid var(--border);
            border-bottom-left-radius: 4px;
        }

        .thinking {
            opacity: 0.7;
            font-style: italic;
        }

        .input-area {
            padding: 13px;
            display: flex;
            gap: 10px;
            background: var(--container);
            border-top: 1px solid var(--border);
        }

        #messageInput {
            flex: 1;
            padding: 12px 14px;
            border: 1px solid var(--border);
            border-radius: 9px;
            font-size: 15px;
            background: var(--container);
            color: var(--text);
            outline: none;
        }

        #messageInput:focus {
            border-color: var(--primary);
        }

        #sendButton {
            width: 90px;
            border: none;
            border-radius: 9px;
            background: var(--primary);
            color: white;
            font-size: 15px;
            cursor: pointer;
        }

        #sendButton:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        @media (max-width: 600px) {
            .app {
                width: 100%;
                height: 100vh;
                border-radius: 0;
            }

            .header h1 {
                font-size: 18px;
            }

            .header p {
                display: none;
            }

            .small-button {
                padding: 7px;
            }

            .bubble {
                max-width: 88%;
            }
        }
    </style>
</head>

<body>
    <main class="app">
        <header class="header">
            <div>
                <h1>Trợ lý AI sinh viên</h1>
                <p>Ứng dụng Flask tích hợp Gemini API</p>
            </div>

            <div class="header-actions">
                <button
                    class="small-button"
                    onclick="toggleTheme()"
                    title="Đổi chế độ sáng tối"
                >
                    🌙
                </button>

                <button
                    class="small-button"
                    onclick="clearChat()"
                    title="Xóa cuộc trò chuyện"
                >
                    Xóa
                </button>
            </div>
        </header>

        <section id="chatBox"></section>

        <footer class="input-area">
            <input
                id="messageInput"
                type="text"
                placeholder="Nhập câu hỏi..."
                autocomplete="off"
            >

            <button id="sendButton" onclick="sendMessage()">
                Gửi
            </button>
        </footer>
    </main>

    <script>
        const chatBox = document.getElementById("chatBox");
        const messageInput = document.getElementById("messageInput");
        const sendButton = document.getElementById("sendButton");

        let messages = JSON.parse(
            localStorage.getItem("studentAiMessages")
        ) || [];

        function saveMessages() {
            localStorage.setItem(
                "studentAiMessages",
                JSON.stringify(messages)
            );
        }

        function createMessage(role, content, temporary = false) {
            const row = document.createElement("div");
            const bubble = document.createElement("div");

            row.className = `message-row ${role}`;
            bubble.className = "bubble";
            bubble.textContent = content;

            if (temporary) {
                bubble.classList.add("thinking");
            }

            row.appendChild(bubble);
            chatBox.appendChild(row);
            chatBox.scrollTop = chatBox.scrollHeight;

            return row;
        }

        function loadMessages() {
            chatBox.innerHTML = "";

            if (messages.length === 0) {
                createMessage(
                    "ai",
                    "Xin chào! Tôi là trợ lý AI. Bạn cần hỗ trợ gì?"
                );
                return;
            }

            messages.forEach((message) => {
                createMessage(message.role, message.content);
            });
        }

        async function sendMessage() {
            const text = messageInput.value.trim();

            if (!text || sendButton.disabled) {
                return;
            }

            messages.push({
                role: "user",
                content: text
            });

            saveMessages();
            createMessage("user", text);

            messageInput.value = "";
            messageInput.disabled = true;
            sendButton.disabled = true;

            const thinkingMessage = createMessage(
                "ai",
                "AI đang suy nghĩ...",
                true
            );

            try {
                const response = await fetch("/chat", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        message: text
                    })
                });

                const data = await response.json();
                thinkingMessage.remove();

                const reply =
                    data.reply || "Đã xảy ra lỗi, bạn hãy thử lại.";

                messages.push({
                    role: "ai",
                    content: reply
                });

                saveMessages();
                createMessage("ai", reply);

            } catch (error) {
                thinkingMessage.remove();

                const errorMessage =
                    "Không thể kết nối với máy chủ.";

                messages.push({
                    role: "ai",
                    content: errorMessage
                });

                saveMessages();
                createMessage("ai", errorMessage);

            } finally {
                messageInput.disabled = false;
                sendButton.disabled = false;
                messageInput.focus();
            }
        }

        function clearChat() {
            const accepted = confirm(
                "Bạn có chắc muốn xóa cuộc trò chuyện không?"
            );

            if (!accepted) {
                return;
            }

            messages = [];
            saveMessages();
            loadMessages();
        }

        function toggleTheme() {
            document.body.classList.toggle("dark");

            const darkMode =
                document.body.classList.contains("dark");

            localStorage.setItem(
                "studentAiDarkMode",
                darkMode
            );
        }

        function loadTheme() {
            const darkMode =
                localStorage.getItem("studentAiDarkMode") === "true";

            if (darkMode) {
                document.body.classList.add("dark");
            }
        }

        messageInput.addEventListener("keydown", function (event) {
            if (event.key === "Enter") {
                sendMessage();
            }
        });

        loadTheme();
        loadMessages();
        messageInput.focus();
    </script>
</body>
</html>
